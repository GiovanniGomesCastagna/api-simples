
services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always

    env_file:
    - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "2671:5432"

    volumes:
      - ./postgres_data/postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    container_name: API-LOJA-ETRIAX
    restart: always

    env_file:
      - .env

    ports:
      - "3366:3366"

    depends_on:
      - postgres

    volumes:
      - ./api:/src
      - /src/node_modules

volumes:
  postgres_data:
